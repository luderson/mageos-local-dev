networks:
  mageos:
    driver: bridge

volumes:
  db-data-mariadb:
  redis-data:
  opensearch-data:
  rabbitmq-data:

services:
  # ---------------------------------------------------------------------
  # Traefik: single public entrypoint, terminates TLS with the mkcert
  # certificate generated by setup.sh. Everything else stays off the host
  # network and is reached only by hostname through Traefik.
  # ---------------------------------------------------------------------
  traefik:
    image: traefik:v3.7.5
    container_name: ${COMPOSE_PROJECT_NAME}_traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=mageos
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"
      - "443:443"
      # Dashboard: bound to localhost only, never exposed on the LAN.
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/etc/traefik/certs:ro
    networks:
      - mageos
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # nginx: serves static assets, proxies everything else to php-fpm.
  # Only reachable from Traefik on the internal network -- no host port.
  # ---------------------------------------------------------------------
  nginx:
    build:
      context: docker/nginx
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    volumes:
      - ./src:/var/www/html:ro
    depends_on:
      - php-fpm
    networks:
      - mageos
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.mageos-web.rule=Host(`${BASE_DOMAIN}`)
      - traefik.http.routers.mageos-web.entrypoints=websecure
      - traefik.http.routers.mageos-web.tls=true
      - traefik.http.services.mageos-web.loadbalancer.server.port=8080

  # ---------------------------------------------------------------------
  # php-fpm: application runtime. Bind-mounts ./src read-write so code
  # edited on the host is picked up immediately; also doubles as the
  # container setup.sh execs `composer` / `bin/magento` commands in.
  # ---------------------------------------------------------------------
  php-fpm:
    build:
      context: docker/php-fpm
      args:
        PHP_VERSION: ${PHP_VERSION}
        UID: ${HOST_UID}
        GID: ${HOST_GID}
    container_name: ${COMPOSE_PROJECT_NAME}_php-fpm
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: mariadb
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      BASE_DOMAIN: ${BASE_DOMAIN}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mageos
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------
  mariadb:
    image: mariadb:${MARIADB_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_mariadb
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data-mariadb:/var/lib/mysql
    networks:
      - mageos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Redis: cache + session storage.
  # ---------------------------------------------------------------------
  redis:
    image: redis:${REDIS_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    volumes:
      - redis-data:/data
    networks:
      - mageos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # OpenSearch: required catalog/full-text search backend for Magento
  # 2.4.4+ / MageOS. Single-node, security plugin disabled -- fine for a
  # local dev box that isn't reachable off the Docker network; do not
  # reuse this config for anything internet-facing.
  # ---------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - mageos
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ---------------------------------------------------------------------
  # RabbitMQ: async message queue (order processing, indexing, etc.).
  # ---------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - mageos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Mailpit: catches all outgoing mail (order confirmations, password
  # resets) instead of sending it, with a web UI to inspect messages.
  # ---------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_mailpit
    networks:
      - mageos
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.mageos-mail.rule=Host(`mail.${BASE_DOMAIN}`)
      - traefik.http.routers.mageos-mail.entrypoints=websecure
      - traefik.http.routers.mageos-mail.tls=true
      - traefik.http.services.mageos-mail.loadbalancer.server.port=8025

  # ---------------------------------------------------------------------
  # Node/Grunt: theme build watcher for LESS/JS compilation during theme
  # development. Idles until Gruntfile.js exists in ./src (see entrypoint).
  # ---------------------------------------------------------------------
  node:
    build:
      context: docker/node
      args:
        NODE_VERSION: ${NODE_VERSION}
        UID: ${HOST_UID}
        GID: ${HOST_GID}
    container_name: ${COMPOSE_PROJECT_NAME}_node
    volumes:
      - ./src:/var/www/html
    networks:
      - mageos
    restart: unless-stopped

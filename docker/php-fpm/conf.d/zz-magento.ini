; Baseline PHP settings recommended for running Magento/MageOS locally.
; Filename is prefixed zz- so it loads (and wins) after the base php.ini defaults.

memory_limit = 2G
max_execution_time = 600
zlib.output_compression = Off

upload_max_filesize = 64M
post_max_size = 64M

realpath_cache_size = 10M
realpath_cache_ttl = 7200

; OPcache tuned for local development: validate_timestamps stays on so edits
; to bind-mounted source are picked up without a container restart.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 60000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
